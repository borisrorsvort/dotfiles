[tasks.setup-bepo]
description = "Install and configure Bépo keyboard layout for macOS"
run = """
#!/bin/bash
set -e
echo "🍏 Setting up Bépo layout for macOS..."
DEST_DIR="$HOME/Library/Keyboard Layouts"

if ls "$DEST_DIR"/*bepo*.bundle 1> /dev/null 2>&1 || ls "$DEST_DIR"/*bepo*.keylayout 1> /dev/null 2>&1; then
    echo "✅ Bépo layout is already installed in $DEST_DIR."
    exit 0
fi

mkdir -p "$DEST_DIR"
DMG_URL="https://cdn.bepo.fr/macosx/fr-dvorak-bepo-macosx-1.1rc2.dmg"
TEMP_DMG="/tmp/bepo.dmg"

echo "Downloading Bépo macOS driver..."
curl -sL "$DMG_URL" -o "$TEMP_DMG"

echo "Mounting DMG..."
VOLUME=$(hdiutil attach "$TEMP_DMG" | grep -o "/Volumes/.*")

echo "Installing layout bundle to $DEST_DIR..."
cp -r "$VOLUME"/*.bundle "$DEST_DIR/"

echo "Unmounting DMG..."
hdiutil detach "$VOLUME" >/dev/null
rm "$TEMP_DMG"

echo "✅ Bépo layout installed!"
echo "⚠️  Action Required: Restart your Mac (or log out), then go to System Settings -> Keyboard -> Edit/Input Sources -> Add 'Bépo'."
"""
