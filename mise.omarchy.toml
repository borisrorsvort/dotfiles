[bootstrap.packages]
"pacman:zsh" = "latest"
"pacman:tmux" = "latest"
"pacman:git" = "latest"

[tasks.setup-bepo]
description = "Install and configure Bépo keyboard layout for Omarchy"
run = """
#!/bin/bash
set -e
echo "🐧 Setting up Bépo layout for Linux..."

# 1. Omarchy / Hyprland (Wayland)
if command -v hyprctl >/dev/null 2>&1 || [ -n "$HYPRLAND_INSTANCE_SIGNATURE" ]; then
    echo "💠 Omarchy/Hyprland detected."
    if hyprctl getoption input:kb_variant 2>/dev/null | grep -q "bepo"; then
        echo "✅ Bépo layout is already active in Hyprland."
    else
        hyprctl keyword input:kb_layout fr 2>/dev/null || true
        hyprctl keyword input:kb_variant bepo 2>/dev/null || true
        echo "✅ Runtime layout updated via hyprctl."
        echo "⚠️  Action Required: Persist this in your Hyprland config:"
        echo -e "input {\\n    kb_layout = fr\\n    kb_variant = bepo\\n}"
    fi
fi

# 2. X11 / System-wide fallback
if command -v localectl >/dev/null 2>&1; then
    if localectl status | grep -q "X11 Variant: bepo"; then
        echo "✅ Bépo layout is already configured system-wide."
    else
        echo "⚙️ Setting system-wide X11/Console keymap via localectl..."
        sudo localectl set-x11-keymap fr pc105 bepo || echo "⚠️  localectl failed (requires sudo)."
    fi
fi
if command -v setxkbmap >/dev/null 2>&1; then
    echo "⚙️ Setting current X11 session keymap..."
    setxkbmap fr bepo 2>/dev/null || true
fi

echo "✅ Linux Bépo setup complete."
"""

[tasks.link-omarchy-skills]
description = "Link system-wide Omarchy AI skills into local agents folder"
run = """
#!/bin/bash
set -e
mkdir -p ~/.agents/skills
if [ -d /usr/share/omarchy/default/agents/skills/omarchy ]; then
    ln -sfn /usr/share/omarchy/default/agents/skills/omarchy ~/.agents/skills/omarchy
fi
if [ -d /usr/share/omarchy/default/agents/skills/diagnose-crash ]; then
    ln -sfn /usr/share/omarchy/default/agents/skills/diagnose-crash ~/.agents/skills/diagnose-crash
fi
echo "Linked Omarchy system skills."
"""
